# Gera o APK do Rede Delas de graça no GitHub (aba "Actions").
# Roda sozinho a cada envio de arquivos, ou manualmente em Actions > Gerar APK > Run workflow.
name: Gerar APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk RedeDelas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RedeDelas-apk
          path: RedeDelas.apk
